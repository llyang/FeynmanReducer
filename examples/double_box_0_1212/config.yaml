kinematics:
  loop_momenta: ["k1", "k2"]
  external_momenta: ["p1", "p2", "p3", "p4"]
  conservation:
    "p4": "-p1-p2-p3"
  invariants:
    "p1^2": "p1sq"
    "p2^2": "p2sq"
    "p3^2": "p1sq"
    "p4^2": "p2sq"
    "(p1+p2)^2": "s"
    "(p2+p3)^2": "t"

propagators:
  - "k1^2"
  - "(k1+p1)^2"
  - "(k1+p1+p2)^2"
  - "(k2+p1+p2)^2"
  - "(k2+p1+p2+p3)^2"
  - "k2^2"
  - "(k1-k2)^2"
  - "(k1+p3)^2"
  - "(k2+p1)^2"

top_sector: [1, 1, 1, 1, 1, 1, 1, 0, 0]

integral_header: "F1"

symmetry_backend: nauty


threads: 24
factor_scan: true
shift_scan: true

targets_file: "targets.txt"
