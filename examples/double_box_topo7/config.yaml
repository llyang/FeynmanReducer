kinematics:
  loop_momenta: ["k1", "k2"]
  external_momenta: ["p1", "p2", "q1", "q2"]
  conservation:
    "q1": "-p1-p2-q2"
  invariants:
    "p1^2": "0"
    "p2^2": "0"
    "q1^2": "m12"
    "q2^2": "0"
    "(p1+p2)^2": "s"
    "(p2-q2)^2": "t"

propagators:
  - "(-k1)^2"
  - "k2^2"
  - "(-k1+k2)^2"
  - "(k1+q2)^2-m22"
  - "(k2-p2)^2"
  - "(-k1+p1+p2)^2"
  - "(k2-p1-p2)^2"
  - "(k1-p2)^2"
  - "(k2-q2)^2"

top_sector: [1, 1, 1, 1, 1, 1, 1, 0, 0]

integral_header: "F1"

symmetry_backend: nauty

threads: 24
factor_scan: true
shift_scan: true

targets_file: "targets.txt"
