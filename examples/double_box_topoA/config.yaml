  - "(k2-q1-q2)^2-mt2"
  - "(k1-q1-q2-q3)^2-mt2"
  - "(k2-q1-q2-q3)^2-mt2"

top_sector: [1, 0, 1, 1, 1, 1, 1, 1, 0]

